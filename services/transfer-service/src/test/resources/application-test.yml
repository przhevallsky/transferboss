identity:
  base-url: http://localhost:8080

consul:
  lock:
    enabled: false

spring:
  flyway:
    clean-disabled: false
    enabled: true

  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

kafka:
  retry:
    delay: 100
    multiplier: 1.0
    max-delay: 200

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.swiftpay: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO
