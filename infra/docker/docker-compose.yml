# TransferHub — Docker Compose for local development
# Usage: docker compose up -d

# Future profiles:
# docker compose --profile monitoring up  → Prometheus, Grafana, Loki, Tempo
# docker compose --profile localstack up  → AWS emulation (S3, SQS, SNS)

services:

  # ──────────────────────────────────────────────
  # PostgreSQL 16 — Relational storage
  # ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: transferhub-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferhub -d transferhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # MongoDB 7 — Document storage
  # ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: transferhub-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: pricing_db
    volumes:
      - mongo-data:/data/db
      - ./mongo/init/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # Redis 7 — Caching / acceleration layer
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: transferhub-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # Apache Kafka (KRaft mode — no Zookeeper)
  # ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: transferhub-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@transferhub-kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://transferhub-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # Kafka Init — one-shot topic creation
  # ──────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: transferhub-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka/init/:/scripts/
    restart: "no"
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # Consul 1.18 — Distributed locking
  # ──────────────────────────────────────────────
  consul:
    image: hashicorp/consul:1.18
    container_name: transferhub-consul
    ports:
      - "8500:8500"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # Unleash — Feature Flag Platform
  # ──────────────────────────────────────────────
  unleash:
    image: unleashorg/unleash-server:5
    container_name: transferhub-unleash
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@transferhub-postgres:5432/unleash"
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: "default:development.unleash-insecure-api-token"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-client-token"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4242/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # ClickHouse — Analytics OLAP database
  # ──────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: transferhub-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init/:/docker-entrypoint-initdb.d/
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────────

  transfer-service:
    build:
      context: ../../
      dockerfile: services/transfer-service/Dockerfile
    container_name: transferhub-transfer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transferhub-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: transferhub-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: transferhub-kafka:29092
      SPRING_CLOUD_CONSUL_HOST: transferhub-consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      PRICING_GRPC_HOST: transferhub-pricing
      PRICING_GRPC_PORT: 9090
      UNLEASH_API_URL: http://transferhub-unleash:4242/api
      UNLEASH_API_TOKEN: "default:development.unleash-insecure-client-token"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://transferhub-tempo:4318/v1/traces
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - transferhub-network

  outbox-service:
    build:
      context: ../../
      dockerfile: services/outbox-service/Dockerfile
    container_name: transferhub-outbox
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transferhub-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: transferhub-kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://transferhub-tempo:4318/v1/traces
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - transferhub-network

  pricing-service:
    build:
      context: ../../
      dockerfile: services/pricing-service/Dockerfile
    container_name: transferhub-pricing
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8082:8082"
      - "9090:9090"
    environment:
      REDIS_HOST: transferhub-redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@transferhub-mongo:27017
      MONGODB_DATABASE: pricing
      GRPC_PORT: 9090
      SERVER_PORT: 8082
    networks:
      - transferhub-network

  mock-payment-service:
    build:
      context: ../../
      dockerfile: services/mock-payment-service/Dockerfile
    container_name: transferhub-mock-payment
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: transferhub-kafka:29092
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - transferhub-network

  mock-payout-service:
    build:
      context: ../../
      dockerfile: services/mock-payout-service/Dockerfile
    container_name: transferhub-mock-payout
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: transferhub-kafka:29092
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - transferhub-network

  notification-gateway:
    build:
      context: ../../services/notification-gateway
    container_name: transferhub-notification
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
      - "8086:8086"
    environment:
      KAFKA_BROKERS: transferhub-kafka:29092
      NOTIFICATION_TOPIC: notification.delivery
      LOG_LEVEL: info
      HTTP_PORT: 8085
      METRICS_PORT: 8086
    networks:
      - transferhub-network

  llm-service:
    build:
      context: ../../
      dockerfile: services/llm-service/Dockerfile
    container_name: transferhub-llm
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transferhub-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - transferhub-network

  analytics-etl:
    build:
      context: ../../
      dockerfile: services/analytics-etl/Dockerfile
    container_name: transferhub-analytics-etl
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: transferhub-kafka:29092
      CLICKHOUSE_URL: jdbc:ch://transferhub-clickhouse:8123/default
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ""
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - transferhub-network

  # ──────────────────────────────────────────────
  # Monitoring Stack (profile: monitoring)
  # docker compose --profile monitoring up
  # ──────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: transferhub-prometheus
    profiles: ["monitoring"]
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--enable-feature=exemplar-storage"
      - "--web.enable-lifecycle"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - transferhub-network

  grafana:
    image: grafana/grafana:10.3.0
    container_name: transferhub-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
      - clickhouse
    networks:
      - transferhub-network

  loki:
    image: grafana/loki:2.9.4
    container_name: transferhub-loki
    profiles: ["monitoring"]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - transferhub-network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: transferhub-promtail
    profiles: ["monitoring"]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - transferhub-network

  tempo:
    image: grafana/tempo:2.3.1
    container_name: transferhub-tempo
    profiles: ["monitoring"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ../monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - transferhub-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: transferhub-alertmanager
    profiles: ["monitoring"]
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - transferhub-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: transferhub-kafka-exporter
    profiles: ["monitoring"]
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=transferhub-kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - transferhub-network

networks:
  transferhub-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data:
  consul-data:
  prometheus-data:
  grafana-data:
  loki-data:
  clickhouse-data:
  tempo-data:
