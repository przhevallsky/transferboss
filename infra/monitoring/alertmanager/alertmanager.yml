global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "dev-null"

  routes:
    - match:
        severity: critical
      receiver: "slack-critical"
    - match:
        severity: warning
      receiver: "slack-default"

receivers:
  - name: "dev-null"

  - name: "slack-critical"
    # Slack webhook — configure in B6
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/PLACEHOLDER"
    #     channel: "#alerts-critical"

  - name: "slack-default"
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/PLACEHOLDER"
    #     channel: "#alerts"
