identity:
  base-url: http://localhost:8080

unleash:
  api-url: http://localhost:4242/api
  api-token: test-token
  app-name: transfer-service
  environment: test
  fetch-toggles-interval: 1

consul:
  lock:
    enabled: false

spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - io.github.resilience4j.springboot3.micrometer.autoconfigure.TimerAutoConfiguration
  flyway:
    clean-disabled: false
    enabled: true

  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

kafka:
  retry:
    delay: 100
    multiplier: 1.0
    max-delay: 200

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.swiftpay: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO
