server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: transfer-service

  datasource:
    url: jdbc:postgresql://localhost:5432/transferhub
    username: transferhub
    password: transferhub
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas:
      - public

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    consumer:
      group-id: transfer-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s

  mvc:
    problemdetails:
      enabled: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

grpc:
  pricing:
    host: ${PRICING_GRPC_HOST:localhost}
    port: ${PRICING_GRPC_PORT:50051}

identity:
  base-url: ${IDENTITY_SERVICE_URL:http://localhost:8080}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
    instances:
      pricing-service:
        baseConfig: default
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 80
        recordExceptions:
          - io.grpc.StatusRuntimeException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - com.swiftpay.transfer.exception.QuoteExpiredException
      identity-service:
        baseConfig: default
        slowCallDurationThreshold: 1s
        recordExceptions:
          - org.springframework.web.client.RestClientException
          - java.net.ConnectException
          - java.net.SocketTimeoutException

unleash:
  api-url: ${UNLEASH_API_URL:http://localhost:4242/api}
  api-token: ${UNLEASH_API_TOKEN:default:development.unleash-insecure-client-token}
  app-name: transfer-service
  environment: development
  fetch-toggles-interval: 10

consul:
  lock:
    enabled: true
    session-ttl-seconds: 15
    acquire-timeout-ms: 5000
    retry-interval-ms: 50
    key-prefix: locks/transfer

logging:
  level:
    com.swiftpay: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
