global:
  resolve_timeout: 5m
  # slack_api_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-default"

  routes:
    - match:
        severity: critical
      receiver: "slack-critical"

receivers:
